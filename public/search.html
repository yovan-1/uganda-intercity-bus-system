<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Bus Schedules | UG Express</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <!-- Route Summary Banner -->
    <div class="card flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 2rem; padding: 1.25rem 1.5rem;">
      <div class="flex items-center gap-3">
        <div class="brand-icon" style="width: 2.75rem; height: 2.75rem;">
          <i data-lucide="bus" style="width: 1.5rem; height: 1.5rem;"></i>
        </div>
        <div>
          <div id="search-route-summary" style="font-size: 1.25rem; font-weight: 700; font-family: var(--font-mono); color: var(--text-main);">
            Loading route...
          </div>
          <div id="search-details-summary" style="font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);">
            Checking connections...
          </div>
        </div>
      </div>

      <a href="index.html" class="btn-primary" style="font-size: 11px;">
        Modify Search
      </a>
    </div>

    <!-- Layout Grid: Sidebar + Trip Results -->
    <div class="grid grid-cols-1" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; align-items: start;">
      <!-- Sidebar Filters -->
      <aside class="card" style="padding: 1.5rem; max-width: 320px; width: 100%;">
        <div class="flex items-center justify-between" style="border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1.25rem;">
          <h3 class="flex items-center gap-2 font-mono" style="font-size: 12px; font-weight: 700; text-transform: uppercase;">
            <i data-lucide="filter" style="width: 14px; height: 14px; color: #000000;"></i>
            Filter Results
          </h3>
        </div>

        <!-- Sort By -->
        <div style="margin-bottom: 1.5rem;">
          <label class="input-label" style="margin-bottom: 0.5rem; display: block;">Sort By</label>
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <button type="button" id="sort-time-btn" class="btn-secondary active text-left" style="font-size: 12px; padding: 0.5rem 0.75rem; justify-content: flex-start;">
              Earliest Departure
            </button>
            <button type="button" id="sort-price-btn" class="btn-secondary text-left" style="font-size: 12px; padding: 0.5rem 0.75rem; justify-content: flex-start;">
              Cheapest Fare
            </button>
          </div>
        </div>

        <!-- Bus Operator -->
        <div>
          <label class="input-label" style="margin-bottom: 0.5rem; display: block;">Bus Operator</label>
          <select id="operator-filter-select" class="form-select" style="padding-left: 0.75rem; font-size: 12px;">
            <option value="ALL">All Operators</option>
          </select>
        </div>
      </aside>

      <!-- Results Column -->
      <section style="flex: 1; min-width: 300px;">
        <div id="trips-results-container">
          <!-- Populated by search.js -->
        </div>
      </section>
    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/search.js"></script>
</body>
</html>
