<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercity Bus Schedules & Timetable | UG Express</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <!-- Page Header Banner -->
    <div class="card flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 2rem; padding: 1.5rem 2rem; border-left: 5px solid var(--must-navy);">
      <div>
        <span class="badge badge-navy" style="font-size: 10px; margin-bottom: 0.35rem;">
          <i data-lucide="calendar" style="width: 12px; height: 12px;"></i> Official Timetable
        </span>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); font-family: var(--font-mono);">
          Uganda Intercity Bus Schedules
        </h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 0.25rem;">
          Browse live daily departures, real-time seat availability, and book your coach travel across Uganda.
        </p>
      </div>

      <div>
        <span id="schedules-count" class="badge badge-green" style="font-size: 12px; padding: 0.5rem 1rem;">
          Loading departures...
        </span>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="card" style="padding: 1.25rem 1.5rem; margin-bottom: 2rem;">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
        <!-- Route Filter -->
        <div class="input-group">
          <label class="input-label">Filter by Route</label>
          <div class="input-control-wrap">
            <i data-lucide="map-pin" class="input-icon"></i>
            <select id="schedule-route-filter" class="form-select">
              <option value="ALL">All Intercity Routes</option>
            </select>
          </div>
        </div>

        <!-- Date Filter & Quick Buttons -->
        <div class="input-group">
          <label class="input-label">Departure Date</label>
          <div class="input-control-wrap">
            <i data-lucide="calendar" class="input-icon"></i>
            <input type="date" id="schedule-date-input" class="form-input">
          </div>
        </div>

        <!-- Operator Filter -->
        <div class="input-group">
          <label class="input-label">Bus Operator</label>
          <div class="input-control-wrap">
            <i data-lucide="bus" class="input-icon"></i>
            <select id="schedule-operator-filter" class="form-select">
              <option value="ALL">All Operators</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Quick Date Filter Pills -->
      <div class="flex items-center gap-2 flex-wrap" style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem; font-size: 12px;">
        <span style="color: var(--text-muted); font-size: 11px; font-family: var(--font-mono);">Quick Filters:</span>
        <button type="button" id="btn-quick-today" class="btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 11px;">Today</button>
        <button type="button" id="btn-quick-tomorrow" class="btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 11px;">Tomorrow</button>
        <button type="button" id="btn-quick-all" class="btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 11px;">All Upcoming Departures</button>
      </div>
    </div>

    <!-- Live Schedules List Container -->
    <section>
      <div id="schedules-list-container">
        <!-- Rendered by js/schedules.js -->
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/schedules.js"></script>
</body>
</html>
