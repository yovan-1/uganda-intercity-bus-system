<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Reservation Portal | UG Express</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <!-- Welcome Header Banner -->
    <div class="card flex items-center justify-between flex-wrap gap-4" style="margin-bottom: 2rem; padding: 1.5rem 2rem; border-left: 5px solid var(--must-navy);">
      <div>
        <span class="badge badge-navy" style="font-size: 10px; margin-bottom: 0.35rem;">Customer Portal</span>
        <h1 id="dash-user-name" style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); font-family: var(--font-mono);">
          Welcome back, Traveler
        </h1>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 0.25rem;">
          Manage your active bus reservations, digital QR tickets, and travel history across Uganda.
        </p>
      </div>

      <a href="index.html" class="btn-primary" style="font-size: 12px;">
        <i data-lucide="plus" style="width: 14px; height: 14px;"></i> Book New Trip
      </a>
    </div>

    <!-- Metrics Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" style="margin-bottom: 2.5rem;">
      <!-- Upcoming Trips -->
      <div class="card flex items-center justify-between" style="padding: 1.5rem;">
        <div>
          <span class="input-label">Upcoming Trips</span>
          <div id="dash-upcoming-count" style="font-size: 2rem; font-weight: 800; font-family: var(--font-mono); color: var(--text-main);">0</div>
        </div>
        <div style="width: 3rem; height: 3rem; border-radius: var(--radius-lg); background: var(--must-navy-light); color: #000000; display: flex; align-items: center; justify-content: center;">
          <i data-lucide="calendar" style="width: 1.5rem; height: 1.5rem;"></i>
        </div>
      </div>

      <!-- Total Bookings -->
      <div class="card flex items-center justify-between" style="padding: 1.5rem;">
        <div>
          <span class="input-label">Total Bookings</span>
          <div id="dash-total-bookings" style="font-size: 2rem; font-weight: 800; font-family: var(--font-mono); color: var(--text-main);">0</div>
        </div>
        <div style="width: 3rem; height: 3rem; border-radius: var(--radius-lg); background: var(--must-navy-light); color: #000000; display: flex; align-items: center; justify-content: center;">
          <i data-lucide="ticket" style="width: 1.5rem; height: 1.5rem;"></i>
        </div>
      </div>

      <!-- Total Spend -->
      <div class="card flex items-center justify-between" style="padding: 1.5rem;">
        <div>
          <span class="input-label">Total Travel Spend</span>
          <div id="dash-total-spend" style="font-size: 1.5rem; font-weight: 800; font-family: var(--font-mono); color: #000000;">UGX 0</div>
        </div>
        <div style="width: 3rem; height: 3rem; border-radius: var(--radius-lg); background: var(--must-green-light); color: var(--must-green); display: flex; align-items: center; justify-content: center;">
          <i data-lucide="credit-card" style="width: 1.5rem; height: 1.5rem;"></i>
        </div>
      </div>
    </div>

    <!-- Bookings List Section -->
    <div>
      <div class="flex items-center justify-between" style="border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1.25rem;">
        <h2 style="font-size: 1.25rem; font-weight: 700; font-family: var(--font-mono);">Your Travel Reservations</h2>
      </div>

      <div id="dash-bookings-list">
        <!-- Rendered dynamically by dashboard.js -->
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
