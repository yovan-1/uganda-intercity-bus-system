<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Sign In & Registration | UG Express</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding-top: 3rem; padding-bottom: 4rem; max-width: 480px;">
    <!-- Brand Header -->
    <div class="text-center" style="margin-bottom: 2rem;">
      <div class="brand-icon" style="width: 3rem; height: 3rem; margin: 0 auto 0.75rem;">
        <i data-lucide="bus" style="width: 1.75rem; height: 1.75rem;"></i>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; font-family: var(--font-mono); color: var(--text-main);">
        UG<span> Express</span> Portal
      </h1>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 0.25rem;">
        Sign in to access your digital tickets, booking history, and seat reservations.
      </p>
    </div>

    <!-- Auth Form Card -->
    <div class="card" style="padding: 2rem;">
      <!-- Toggle Login / Register -->
      <div class="grid grid-cols-2 gap-2" style="background: var(--bg-subtle); padding: 0.25rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-family: var(--font-mono); font-size: 12px;">
        <button type="button" id="tab-login" class="btn-secondary active" style="justify-content: center; padding: 0.5rem;">
          Sign In
        </button>
        <button type="button" id="tab-register" class="btn-secondary" style="justify-content: center; padding: 0.5rem;">
          Register
        </button>
      </div>

      <div id="auth-error-msg" class="badge badge-gold" style="display: none; width: 100%; margin-bottom: 1rem; padding: 0.6rem; justify-content: center; color: #b91c1c; background: #fef2f2; border-color: #fecaca;">
      </div>

      <form id="auth-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Register fields (hidden in sign in mode) -->
        <div id="register-extra-fields" style="display: none;">
          <div class="input-group" style="margin-bottom: 1rem;">
            <label class="input-label">Full Name</label>
            <div class="input-control-wrap">
              <i data-lucide="user" class="input-icon"></i>
              <input type="text" id="auth-name" class="form-input" placeholder="e.g. John Mugisha">
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">Phone Number</label>
            <div class="input-control-wrap">
              <i data-lucide="phone" class="input-icon"></i>
              <input type="tel" id="auth-phone" class="form-input" placeholder="e.g. 0771234567">
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="input-group">
          <label class="input-label">Email Address</label>
          <div class="input-control-wrap">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="auth-email" class="form-input" required placeholder="passenger@travel.ug" value="passenger@travel.ug">
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label class="input-label">Password</label>
          <div class="input-control-wrap">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="auth-password" class="form-input" required placeholder="••••••••" value="Password123!">
          </div>
        </div>

        <button type="submit" id="auth-submit-btn" class="btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; font-size: 12px;">
          Sign In
        </button>
      </form>

      <!-- Quick Demo Persona Helper -->
      <div style="border-top: 1px solid var(--border-color); padding-top: 1.25rem; margin-top: 1.5rem; text-align: center;">
        <span style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); text-transform: uppercase; display: block; margin-bottom: 0.5rem;">
          Quick Demo Accounts
        </span>
        <div class="flex items-center justify-center gap-2 flex-wrap">
          <button type="button" class="btn-secondary quick-demo-btn" data-role="CUSTOMER" style="font-size: 11px; padding: 0.35rem 0.65rem;">
            Customer
          </button>
          <button type="button" class="btn-secondary quick-demo-btn" data-role="STAFF" style="font-size: 11px; padding: 0.35rem 0.65rem;">
            Staff
          </button>
          <button type="button" class="btn-secondary quick-demo-btn" data-role="ADMIN" style="font-size: 11px; padding: 0.35rem 0.65rem;">
            Admin
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
